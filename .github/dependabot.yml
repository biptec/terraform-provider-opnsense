version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Etc/UTC"
    allow:
      - dependency-name: "github.com/biptec/opnsense-go"
    open-pull-requests-limit: 1
    reviewers:
      - "levkohimins"
    commit-message:
      prefix: "chore(deps)"
