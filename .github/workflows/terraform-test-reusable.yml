name: Run terraform tests (reusable)

on:
  workflow_call:
    inputs:
      packages:
        description: 'Go packages to test (e.g. ./... or ./internal/service/firewall/...)'
        type: string
        default: './...'

permissions:
  contents: read

env:
  OPNSENSE_SSH_PORT: 8022
  OPNSENSE_BIND_PLUGIN_COMMIT: d82e2aa8c333952c5a4242278b2a1da5cec3b7c5
  OPNSENSE_WEB_PORT: 8443
  TERRAFORM_PLUGIN_URI: "registry.terraform.io/biptec/opnsense"
  OPNSENSE_KEA_DHCPV6_IFACE: lan
  OPNSENSE_MANAGEMENT_MAC: "52:54:00:12:34:56"
  OPNSENSE_TEST_MANAGEMENT_DEVICE: "vtnet0"
  OPNSENSE_TEST_SPARE_DEVICE_1: "vtnet2"
  OPNSENSE_TEST_SPARE_DEVICE_2: "vtnet3"
  OPNSENSE_TEST_MANAGEMENT_INTERFACE: "lan"
  OPNSENSE_TEST_ROUTE_GATEWAY: "CI_GATEWAY"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build provider
        run: |
          go build -o terraform-provider-opnsense
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-provider-opnsense
          path: terraform-provider-opnsense

  opnsense-image:
    uses: ./.github/workflows/build-opnsense-image-reusable.yml

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Compute test shards
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          python3 << 'EOF'
          import json, os, sys

          # Each shard runs on its own runner with its own OPNsense VM, so
          # shards run in parallel while tests within a shard stay serial.
          # Long-running suites get a dedicated shard; everything else shares
          # "other". Every internal/service/<pkg> directory MUST be assigned
          # to a shard — the check below fails the run otherwise.
          SHARDS = {
              "firewall": ["firewall"],
              "unbound": ["unbound"],
              "ipsec": ["ipsec"],
              "other": ["bind", "caddy", "diagnostics", "dnsmasq", "interfaces", "kea",
                        "openvpn", "quagga", "routes", "routing", "trust", "wireguard"],
          }
          # Non-service packages, tested with "other" on full-suite runs.
          EXTRA_OTHER = ["./internal/provider/...", "./internal/tools/...",
                         "./internal/validators/..."]

          assigned = {p for pkgs in SHARDS.values() for p in pkgs}
          on_disk = {d for d in os.listdir("internal/service")
                     if os.path.isdir(os.path.join("internal/service", d))}
          unassigned = sorted(on_disk - assigned)
          if unassigned:
              sys.exit("internal/service packages not assigned to any shard: "
                       f"{unassigned}. Add them to SHARDS in "
                       ".github/workflows/terraform-test-reusable.yml.")

          requested = os.environ["PACKAGES"].split()
          matrix = []
          if requested == ["./..."]:
              for name, pkgs in SHARDS.items():
                  paths = [f"./internal/service/{p}/..." for p in pkgs]
                  if name == "other":
                      paths += EXTRA_OTHER
                  matrix.append({"name": name, "packages": " ".join(paths)})
          else:
              services = []
              for path in requested:
                  parts = path.split("/")
                  if parts[1:3] != ["internal", "service"] or len(parts) < 4:
                      sys.exit(f"unexpected package path: {path}")
                  services.append(parts[3])
              unknown = sorted(set(services) - assigned)
              if unknown:
                  sys.exit(f"requested packages not assigned to any shard: {unknown}")
              for name, pkgs in SHARDS.items():
                  hit = [p for p in pkgs if p in services]
                  if hit:
                      matrix.append({"name": name,
                                     "packages": " ".join(f"./internal/service/{p}/..." for p in hit)})

          if not matrix:
              sys.exit("no test shards matched the requested packages")
          print(json.dumps(matrix, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(matrix) + "\n")
          EOF

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - build
      - opnsense-image
      - plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: Download OPNsense image
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: opnsense-image
      - name: Decompress OPNsense image
        run: |
          mkdir -p opnsense-images
          bzip2 --decompress --stdout opnsense.qcow2.bz2 > opnsense-images/opnsense.qcow2
      - name: Disable triggers
        run: |
          mkdir -p /etc/dpkg/dpkg.cfg.d
          sudo tee /etc/dpkg/dpkg.cfg.d/01_nodoc > /dev/null << 'EOF'
          path-exclude /usr/share/doc/*
          path-exclude /usr/share/man/*
          path-exclude /usr/share/info/*
          EOF
      - name: Install qemu and NoCloud tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 genisoimage

      - name: Create NoCloud seed
        run: |
          mkdir -p nocloud
          PASSWORD_HASH=$(openssl passwd -6 -salt opnsense-ci 'temporary-ci-password')
          cat > nocloud/user-data << EOF
          #cloud-config
          hostname: opnsense-ci
          user: terraform
          password: '${PASSWORD_HASH}'
          EOF
          cat > nocloud/meta-data << 'EOF'
          instance-id: opnsense-provider-ci
          local-hostname: opnsense-ci
          EOF
          cat > nocloud/network-config << EOF
          version: 1
          config:
            - type: physical
              name: management
              mac_address: '${OPNSENSE_MANAGEMENT_MAC}'
              subnets:
                - type: dhcp4
          EOF
          genisoimage -quiet -output nocloud.iso -volid cidata -joliet -rock \
            nocloud/user-data nocloud/meta-data nocloud/network-config

      - name: Start OPNsense VM
        id: start-vm
        run: |
          qemu-system-x86_64 -machine q35 -m 6144 -smp 2 \
            -device virtio-scsi-pci,id=scsi0 \
            -drive file=opnsense-images/opnsense.qcow2,if=none,id=disk0,format=qcow2 \
            -device scsi-hd,drive=disk0,bus=scsi0.0 \
            -drive file=nocloud.iso,media=cdrom,readonly=on \
            -netdev user,id=user.0,net=10.0.2.0/24,hostfwd=tcp::${{ env.OPNSENSE_SSH_PORT }}-:22,hostfwd=tcp::${{ env.OPNSENSE_WEB_PORT }}-:443 \
            -device "virtio-net-pci,netdev=user.0,mac=${OPNSENSE_MANAGEMENT_MAC}" \
            -netdev user,id=user.1,net=10.0.3.0/24,restrict=on \
            -device virtio-net-pci,netdev=user.1,mac=52:54:00:12:34:57 \
            -netdev user,id=user.2,net=10.0.4.0/24,restrict=on \
            -device virtio-net-pci,netdev=user.2,mac=52:54:00:12:34:58 \
            -netdev user,id=user.3,net=10.0.5.0/24,restrict=on \
            -device virtio-net-pci,netdev=user.3,mac=52:54:00:12:34:59 \
            -device virtio-serial-pci \
            -chardev socket,path=/tmp/qemu-virtconsole.sock,server=on,wait=off,id=qvt0 \
            -device virtconsole,chardev=qvt0 \
            -chardev socket,path=/tmp/qemu-virtserialport.sock,server=on,wait=off,id=qvsp0 \
            -device virtserialport,chardev=qvsp0,name=org.qemu.guest_agent.0 \
            -display none -monitor none -serial file:qemu-console.log &
          QEMU_PID="$!"
          echo "qemu-pid=${QEMU_PID}" >> "$GITHUB_OUTPUT"
          sleep 5
          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "QEMU process not found"
            exit 1
          fi
      - name: Wait for QEMU guest agent
        run: |
          python3 << 'EOF'
          import json, os, select, socket, sys, time
          SOCK = os.environ.get("QEMU_GA_SOCKET", "/tmp/qemu-virtserialport.sock")
          deadline = time.monotonic() + 600
          while time.monotonic() < deadline:
              try:
                  with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
                      s.settimeout(3)
                      s.connect(SOCK)
                      s.sendall((json.dumps({"execute": "guest-ping"}) + "\n").encode())
                      ready, _, _ = select.select([s], [], [], 3)
                      if ready and b'"return"' in s.recv(8192):
                          print("Guest agent is ready", flush=True)
                          sys.exit(0)
              except Exception:
                  pass
              time.sleep(3)
          print("ERROR: Guest agent not ready after 600s", file=sys.stderr)
          sys.exit(1)
          EOF
      - name: Install os-bind candidate
        if: contains(matrix.packages, './internal/service/bind/')
        run: python3 scripts/install-bind-plugin.py

      - name: Create API key
        id: apikey
        run: |
          python3 scripts/create-apikey.py 2> "$GITHUB_OUTPUT"
      - name: Setup env vars for tests
        run: |
          {
            echo "OPNSENSE_API_KEY=${{ steps.apikey.outputs.key }}";
            echo "OPNSENSE_API_SECRET=${{ steps.apikey.outputs.secret }}";
            echo "OPNSENSE_URI=https://localhost:${{ env.OPNSENSE_WEB_PORT }}";
            echo "OPNSENSE_ALLOW_INSECURE=true";
          } >> "$GITHUB_ENV"
      - name: Configure OPNsense for tests
        run: python3 scripts/configure-opnsense.py
      - name: Run terraform tests
        run: |
          env TF_ACC=1 go test -v -p 1 -timeout 120m ${{ matrix.packages }}
      - name: Stop opnsense VM
        if: always()
        run: |
          kill -9 ${{ steps.start-vm.outputs.qemu-pid }} || true
