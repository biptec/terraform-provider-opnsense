name: Build OPNsense Image (reusable)

on:
  workflow_call: {}

permissions:
  contents: read

env:
  OPNSENSE_VERSION: "26.7.1"
  OPNSENSE_URL: "https://github.com/biptec/opnsense-proxmox/releases/download/v26.7.1-2/OPNsense-26.7.1-aab2efa284-amd64.qcow2.bz2"
  OPNSENSE_SHA256: "1e710239a2f386dc180badba971dcb953b24b6775dda816fd92a4074733f67c9"

jobs:
  opnsense-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Restore OPNsense image cache
        id: cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: opnsense-images/opnsense.qcow2.bz2
          key: opnsense-image-${{ env.OPNSENSE_VERSION }}-${{ env.OPNSENSE_SHA256 }}

      - name: Download and verify OPNsense image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p opnsense-images
          curl --fail --location --retry 5 --retry-all-errors \
            "$OPNSENSE_URL" -o opnsense-images/opnsense.qcow2.bz2
          echo "$OPNSENSE_SHA256  opnsense-images/opnsense.qcow2.bz2" | sha256sum -c -

      - name: Verify cached OPNsense image
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "$OPNSENSE_SHA256  opnsense-images/opnsense.qcow2.bz2" | sha256sum -c -

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opnsense-image
          path: opnsense-images/opnsense.qcow2.bz2
          compression-level: 0
