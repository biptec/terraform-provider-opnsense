name: Build OPNsense Image (reusable)

on:
  workflow_call: {}

permissions:
  contents: read

env:
  OPNSENSE_VERSION: "26.7.1"
  OPNSENSE_URL: "https://github.com/biptec/opnsense-proxmox/releases/download/v26.7.1-3/OPNsense-26.7.1-68853ea868-amd64.qcow2.bz2"
  OPNSENSE_SHA256: "3ae58689188074fbd254ad25a04ea8fa8e2a632658671b7f2fb84136756b9445"

jobs:
  opnsense-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Restore OPNsense image cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: opnsense-images/opnsense.qcow2.bz2
          key: opnsense-image-${{ env.OPNSENSE_VERSION }}-${{ env.OPNSENSE_SHA256 }}

      - name: Download and verify OPNsense image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p opnsense-images
          curl --fail --location --retry 5 --retry-all-errors \
            "$OPNSENSE_URL" -o opnsense-images/opnsense.qcow2.bz2
          echo "$OPNSENSE_SHA256  opnsense-images/opnsense.qcow2.bz2" | sha256sum -c -

      - name: Verify cached OPNsense image
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "$OPNSENSE_SHA256  opnsense-images/opnsense.qcow2.bz2" | sha256sum -c -

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opnsense-image
          path: opnsense-images/opnsense.qcow2.bz2
          compression-level: 0
